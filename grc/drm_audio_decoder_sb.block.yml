id: drm_audio_decoder_sb
label: DRM AAC Decoder (FAAD2)
category: '[DRM]/Receiver'
flags: [python, cpp]
templates:
  imports: from drm_next.drm_python import audio_decoder_sb
  make: audio_decoder_sb(${tp})
parameters:
- id: tp
  label: Transmission parameters
  dtype: raw
inputs:
- domain: stream
  dtype: byte
  vlen: ${tp.msc().L_MUX()}
outputs:
- domain: stream
  dtype: float
file_format: 1
