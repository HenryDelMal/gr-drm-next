id: drm_partitioning_16_bb
label: DRM Partitioning 16-QAM EEP
category: '[DRM]/Transmitter'
flags:
- python
templates:
  imports: import drm_next as drm
  make: drm.partitioning_bb(${vlen_in}, ${vlen_out})
parameters:
- id: vlen_in
  label: Input vector length
  dtype: int
  hide: part
- id: vlen_out
  label: Output vector lengths
  dtype: raw
  hide: part
- id: vlen1
  label: Length of topmost output
  dtype: int
  hide: part
- id: vlen2
  label: Length of second output
  dtype: int
  hide: part
inputs:
- label: in
  domain: stream
  dtype: byte
outputs:
- label: out1
  domain: stream
  dtype: byte
- label: out2
  domain: stream
  dtype: byte
file_format: 1
