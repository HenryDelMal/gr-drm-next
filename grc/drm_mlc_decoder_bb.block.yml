id: drm_mlc_decoder_bb
label: DRM MLC Decoder
category: '[DRM]/Receiver'
flags: [python, cpp]
templates:
  imports: from drm.drm_python import mlc_decoder_bb
  make: mlc_decoder_bb(${tp}, ${channel_type})
parameters:
- id: tp
  label: Transmission parameters
  dtype: raw
- id: channel_type
  label: Channel
  dtype: enum
  options: ['"MSC"', '"SDC"', '"FAC"']
  option_labels: [MSC, SDC, FAC]
inputs:
- domain: stream
  dtype: byte
  multiplicity: ${tp.msc().n_levels_mlc() if channel_type == '"MSC"' else tp.sdc().n_levels_mlc() if channel_type == '"SDC"' else 1}
outputs:
- domain: stream
  dtype: byte
file_format: 1
