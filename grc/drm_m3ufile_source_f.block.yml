id: drm_m3ufile_source_f
label: M3U(8) file source
category: '[DRM]'
flags:
- python
templates:
  imports: import drm_next as drm
  make: drm.m3ufile_source_f(${filename}, ${tp})
parameters:
- id: filename
  label: file name
  dtype: file_open
  default: ''
- id: tp
  label: transmit params
  dtype: raw
outputs:
- label: out
  domain: stream
  dtype: float
documentation: Accepts M3U playlist file in standard or extended format and streams its content. There must not be any blank lines in the file. Audio files have to be in WAV format.
file_format: 1
