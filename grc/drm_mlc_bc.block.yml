id: mlc_bc
label: MLC Factory Block
category: '[DRM]/Transmitter'
flags:
- python
templates:
  imports: import drm_next as drm
  make: drm.make_mlc(${channel_type}, ${tp})
parameters:
- id: channel_type
  label: Channel Type
  dtype: enum
  default: '""'
  options:
  - '"FAC"'
  - '"SDC"'
  - '"MSC"'
  option_labels:
  - FAC
  - SDC
  - MSC
- id: tp
  label: Transmit Params
  dtype: raw
  hide: part
inputs:
- label: in
  domain: stream
  dtype: byte
outputs:
- label: out
  domain: stream
  dtype: complex
file_format: 1
