id: drm_punct_bb
label: Puncturing
category: '[DRM]/Transmitter'
flags:
- python
templates:
  imports: import drm
  make: drm.punct_bb(${punct_pat_1}, ${punct_pat_2}, ${vlen_in}, ${vlen_out}, ${num_tailbits})
parameters:
- id: punct_pat_1
  label: Puncturing Pattern 1
  dtype: raw
  hide: part
- id: punct_pat_2
  label: Puncturing Pattern 2
  dtype: raw
  hide: part
- id: vlen_in
  label: Input Vector Length
  dtype: int
  hide: part
- id: vlen_out
  label: Output Vector Length
  dtype: int
  hide: part
- id: num_tailbits
  label: Number of Tail Bits
  dtype: int
  hide: part
inputs:
- label: in
  domain: stream
  dtype: byte
outputs:
- label: out
  domain: stream
  dtype: byte
file_format: 1
